<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case Study — SAHIL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .case-page { min-height:100vh; padding:2rem 2.5rem 5rem; }
    .case-nav { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding-bottom:1.5rem; border-bottom:1px solid var(--border); }
    .case-nav a { text-decoration:none; }
    .case-back { color:var(--muted-foreground); font-size:.75rem; letter-spacing:.08em; }
    .case-hero { padding:clamp(4rem,10vw,9rem) 0 3rem; }
    .case-kicker { color:var(--primary); font-size:.75rem; letter-spacing:.12em; font-weight:800; }
    .case-hero h1 { margin:1rem 0; font-size:clamp(3.5rem,11vw,9rem); line-height:.9; letter-spacing:-.06em; }
    .case-intro { max-width:700px; color:var(--muted-foreground); font-size:clamp(1.05rem,2vw,1.35rem); line-height:1.8; }
    .case-cover { width:100%; aspect-ratio:16/8; border-radius:1rem; overflow:hidden; background:var(--card); }
    .case-cover img { width:100%; height:100%; object-fit:cover; display:block; }
    .case-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:2rem; margin:4rem 0; }
    .case-meta { border-top:1px solid var(--border); padding-top:1rem; }
    .case-meta span { display:block; color:var(--muted-foreground); font-size:.7rem; letter-spacing:.1em; margin-bottom:.7rem; }
    .case-meta strong { font-size:.95rem; font-weight:500; }
    .case-content { max-width:850px; }
    .case-content section { margin:4rem 0; }
    .case-content h2 { font-size:clamp(2rem,5vw,4rem); letter-spacing:-.04em; margin-bottom:1rem; }
    .case-content p, .case-content li { color:var(--muted-foreground); line-height:1.9; }
    .case-content ul { padding-left:1.25rem; }
    .case-cta { display:inline-flex; margin-top:2rem; padding:1rem 1.3rem; border:1px solid var(--border); border-radius:99px; text-decoration:none; }
    @media(max-width:700px) { .case-page{padding:1.25rem 1rem 3rem}.case-grid{grid-template-columns:1fr;gap:1.5rem}.case-cover{aspect-ratio:4/3}.case-nav{align-items:flex-start} }
  </style>
</head>
<body>
  <main class="case-page">
    <nav class="case-nav"><a class="wordmark" href="index.html">SAHIL<sup>®</sup></a><a class="case-back" href="index.html#work">← BACK TO WORK</a></nav>
    <div id="case-content"><p>Loading case study…</p></div>
  </main>
  <script src="case-study.js"></script>
</body>
</html>
